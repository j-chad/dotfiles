StylesPath = styles

MinAlertLevel = suggestion

Packages = Google, write-good, proselint, Readability, Commits

# Markdown, MDX, HTML, Plain text.
[*.{md,mdx,html,txt}]
BasedOnStyles = Vale, Google, write-good, proselint, Readability

# Comments in Python, Go, Rust, JavaScript, TypeScript, Protobuf, CSS
# and Sass sources.
[*.{py,go,rs,js,jsx,ts,tsx,proto,css,scss,sass,less}]
BasedOnStyles = Vale, Google, write-good, proselint, Readability

# OpenAPI specs: The title, and every summary and description, read as
# Markdown.
[{openapi,swagger}*.{yml,yaml,json}]
BasedOnStyles = Vale, Google, write-good, proselint, Readability
View = OpenAPI

# JSON Schema: Every description under definitions, read as Markdown.
[*.schema.json]
BasedOnStyles = Vale, Google, write-good, proselint, Readability
View = Schema

# Commit messages: Subject, body, and trailers as separate scopes; Git’s
# comment lines are skipped.
[COMMIT_EDITMSG]
BasedOnStyles = Commits, CommitLint, Vale, Google, write-good, proselint, Readability
CommitLint.Body = suggestion
CommitLint.FooterRequired = no
CommitLint.Trailer = no
CommitLint.References = no
